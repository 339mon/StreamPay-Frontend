openapi: 3.1.0
info:
  title: StreamPay API
  version: 2.0.0
paths:
  /api/reconciliation:
    get:
      summary: Retrieve public reconciliation overview
      description: |
        Returns a paginated list of public reconciliation records showing
        totals that have been reconciled per currency and their current status.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1–1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Reconciliation overview retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationOverview'
              examples:
                reconciliationOverview:
                  summary: Sample reconciliation overview
                  value:
                    status: success
                    data:
                      - id: rec-pub-1
                        totalReconciled: 1500
                        currency: XLM
                        status: completed
                      - id: rec-pub-2
                        totalReconciled: 300
                        currency: USDC
                        status: pending
                    meta:
                      total: 2
                      limit: 100
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              examples:
                invalidLimit:
                  summary: Limit validation error
                  value:
                    error:
                      code: INVALID_INPUT
                      message: Limit must be an integer between 1 and 1000
                      request_id: req_abc123
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              examples:
                rateLimited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limit_exceeded
                      message: Rate limit exceeded. Retry after 30 seconds.
                      request_id: req_abc123
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                serverError:
                  summary: Unexpected error
                  value:
                    error:
                      code: INTERNAL_SERVER_ERROR
                      message: An unexpected error occurred
                      request_id: req_abc123
  /api/exports:
    post:
      summary: Request a new export job
      responses:
        '201':
          description: Export job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
              examples:
                exportRequested:
                  summary: Basic export request
                  value:
                    data:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      ownerId: "GB2ABCD..."
                      requestedAt: "2026-07-24T12:00:00Z"
                      status: "pending"
                      expiresAt: "2026-07-31T12:00:00Z"
                      fileName: "streampay-export-2026-07-24.csv"
                      rows: 0
                    links:
                      self: "/api/exports/123e4567-e89b-12d3-a456-426614174000"
  /api/exports/{id}:
    get:
      summary: Get the status of an export job or download it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: boolean
        - name: expires
          in: query
          required: false
          schema:
            type: string
        - name: sig
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Export job status or download
          content:
            application/json:
              examples:
                exportReady:
                  summary: Export job is ready
                  value:
                    data:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      ownerId: "GB2ABCD..."
                      requestedAt: "2026-07-24T12:00:00Z"
                      status: "ready"
                      expiresAt: "2026-07-31T12:00:00Z"
                      fileName: "streampay-export-2026-07-24.csv"
                      rows: 15
                      signedUrl: "/api/exports/123e4567...?download=true&expires=...&sig=..."
                      signedUrlExpiresAt: "2026-07-24T13:00:00Z"
        '404':
          description: Not found
          content:
            application/json:
              examples:
                notFound:
                  summary: Export job not found
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Export job not found."
                      request_id: "req_xyz"
        '410':
          description: Gone
          content:
            application/json:
              examples:
                expired:
                  summary: Export job expired
                  value:
                    error:
                      code: "EXPORT_EXPIRED"
                      message: "The export job has expired."
                      request_id: "req_xyz"
components:
  schemas:
    ReconciliationOverview:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              totalReconciled:
                type: number
              currency:
                type: string
              status:
                type: string
                enum: [completed, pending, failed]
        meta:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
    ExportJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            ownerId:
              type: string
            requestedAt:
              type: string
            status:
              type: string
            expiresAt:
              type: string
            fileName:
              type: string
            rows:
              type: integer
            signedUrl:
              type: string
            signedUrlExpiresAt:
              type: string
        links:
          type: object
          properties:
            self:
              type: string
