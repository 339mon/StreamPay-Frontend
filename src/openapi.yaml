openapi: 3.1.0
info:
  title: StreamPay API
  version: 2.0.0
paths:
  /api/auth/wallet:
    get:
      summary: Issue a wallet authentication challenge
      description: |
        Returns a one-time nonce the client must sign with their Stellar
        private key, then submit to `POST /api/auth/wallet`.
      parameters:
        - name: address
          in: query
          required: true
          description: Stellar public key (G…, 56 characters).
          schema:
            type: string
            pattern: '^G[A-Z2-7]{55}$'
            example: GABC1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ234567890ABCDEFG
      responses:
        '200':
          description: Challenge issued
          content:
            application/json:
              examples:
                walletChallenge:
                  summary: Successful challenge issuance
                  value:
                    challenge: streampay_auth_1716000000000_x7k2m
                    expires_at: '2024-01-15T10:05:00.000Z'
        '400':
          description: Missing or invalid address
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: Correlation ID for structured logging
          content:
            application/json:
              examples:
                missingAddress:
                  summary: Address query parameter missing
                  value:
                    error:
                      code: BAD_REQUEST
                      message: address query parameter is required.
                      request_id: req_01HZ9ABCDEF
        '422':
          description: Validation error
          content:
            application/json:
              examples:
                validationError:
                  summary: Invalid Stellar address
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: One or more query parameters are invalid.
                      request_id: req_01HZ9ABCDEF
                      details:
                        - field: address
                          code: INVALID_ADDRESS
                          message: address must be a valid Stellar public key.
        '429':
          description: IP rate limit exceeded
          content:
            application/json:
              examples:
                rateLimited:
                  summary: Too many challenge requests
                  value:
                    error:
                      code: rate_limit_exceeded
                      message: Too many requests. Please try again later.
                      request_id: req_01HZ9ABCDEF
    post:
      summary: Verify a signed challenge and issue a bearer token
      description: |
        Wallet login endpoint. Rate-limited to mitigate brute-force attempts.
      requestBody:
        required: true
        content:
          application/json:
            examples:
              verifySignature:
                summary: Signed challenge payload
                value:
                  address: GABC1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ234567890ABCDEFG
                  challenge: streampay_auth_1716000000000_x7k2m
                  signature: dGVzdHNpZ25hdHVyZQ==
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              examples:
                walletToken:
                  summary: Successful token issuance
                  value:
                    token: tok_R0FCQzEyMzQ1Njc4OTA
                    expires_at: '2024-01-16T10:00:00.000Z'
        '400':
          description: Invalid request body
          content:
            application/json:
              examples:
                invalidBody:
                  summary: Malformed JSON body
                  value:
                    error:
                      code: BAD_REQUEST
                      message: Request body must be valid JSON.
                      request_id: req_01HZ9ABCDEF
        '401':
          description: Signature verification failed
          content:
            application/json:
              examples:
                unauthorized:
                  summary: Invalid signature
                  value:
                    error:
                      code: UNAUTHORIZED
                      message: Challenge signature verification failed.
                      request_id: req_01HZ9ABCDEF
        '422':
          description: Validation error
          content:
            application/json:
              examples:
                validationError:
                  summary: Missing required fields
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: One or more fields are invalid.
                      request_id: req_01HZ9ABCDEF
                      details:
                        - field: signature
                          code: MISSING_FIELD
                          message: signature is required.
        '429':
          description: IP rate limit exceeded
          content:
            application/json:
              examples:
                rateLimited:
                  summary: Too many login attempts
                  value:
                    error:
                      code: rate_limit_exceeded
                      message: Too many requests. Please try again later.
                      request_id: req_01HZ9ABCDEF
  /api/reconciliation:
    get:
      summary: Retrieve public reconciliation overview
      description: |
        Returns a paginated list of public reconciliation records showing
        totals that have been reconciled per currency and their current status.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of records to return (1–1000).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: Reconciliation overview retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationOverview'
              examples:
                reconciliationOverview:
                  summary: Sample reconciliation overview
                  value:
                    status: success
                    data:
                      - id: rec-pub-1
                        totalReconciled: 1500
                        currency: XLM
                        status: completed
                      - id: rec-pub-2
                        totalReconciled: 300
                        currency: USDC
                        status: pending
                    meta:
                      total: 2
                      limit: 100
        '400':
          description: Invalid limit parameter
          content:
            application/json:
              examples:
                invalidLimit:
                  summary: Limit validation error
                  value:
                    error:
                      code: INVALID_INPUT
                      message: Limit must be an integer between 1 and 1000
                      request_id: req_abc123
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              examples:
                rateLimited:
                  summary: Too many requests
                  value:
                    error:
                      code: rate_limit_exceeded
                      message: Rate limit exceeded. Retry after 30 seconds.
                      request_id: req_abc123
        '500':
          description: Internal server error
          content:
            application/json:
              examples:
                serverError:
                  summary: Unexpected error
                  value:
                    error:
                      code: INTERNAL_SERVER_ERROR
                      message: An unexpected error occurred
                      request_id: req_abc123
  /api/exports:
    post:
      summary: Request a new export job
      responses:
        '201':
          description: Export job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobResponse'
              examples:
                exportRequested:
                  summary: Basic export request
                  value:
                    data:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      ownerId: "GB2ABCD..."
                      requestedAt: "2026-07-24T12:00:00Z"
                      status: "pending"
                      expiresAt: "2026-07-31T12:00:00Z"
                      fileName: "streampay-export-2026-07-24.csv"
                      rows: 0
                    links:
                      self: "/api/exports/123e4567-e89b-12d3-a456-426614174000"
  /api/exports/{id}:
    get:
      summary: Get the status of an export job or download it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: download
          in: query
          required: false
          schema:
            type: boolean
        - name: expires
          in: query
          required: false
          schema:
            type: string
        - name: sig
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Export job status or download
          content:
            application/json:
              examples:
                exportReady:
                  summary: Export job is ready
                  value:
                    data:
                      id: "123e4567-e89b-12d3-a456-426614174000"
                      ownerId: "GB2ABCD..."
                      requestedAt: "2026-07-24T12:00:00Z"
                      status: "ready"
                      expiresAt: "2026-07-31T12:00:00Z"
                      fileName: "streampay-export-2026-07-24.csv"
                      rows: 15
                      signedUrl: "/api/exports/123e4567...?download=true&expires=...&sig=..."
                      signedUrlExpiresAt: "2026-07-24T13:00:00Z"
        '404':
          description: Not found
          content:
            application/json:
              examples:
                notFound:
                  summary: Export job not found
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Export job not found."
                      request_id: "req_xyz"
        '410':
          description: Gone
          content:
            application/json:
              examples:
                expired:
                  summary: Export job expired
                  value:
                    error:
                      code: "EXPORT_EXPIRED"
                      message: "The export job has expired."
                      request_id: "req_xyz"
components:
  schemas:
    ReconciliationOverview:
      type: object
      properties:
        status:
          type: string
          enum: [success, error]
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              totalReconciled:
                type: number
              currency:
                type: string
              status:
                type: string
                enum: [completed, pending, failed]
        meta:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
    ExportJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            ownerId:
              type: string
            requestedAt:
              type: string
            status:
              type: string
            expiresAt:
              type: string
            fileName:
              type: string
            rows:
              type: integer
            signedUrl:
              type: string
            signedUrlExpiresAt:
              type: string
        links:
          type: object
          properties:
            self:
              type: string
